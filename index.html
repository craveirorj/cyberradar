<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>CyberRadar</title>
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#070b14; --panel:#0d1424; --panel2:#111b30; --line:#1c2a47;
  --text:#e6edf8; --muted:#8a9bb8; --accent:#22d3ee; --accent2:#7c5cff; --ok:#34d399; --warn:#fbbf24; --bad:#f43f5e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;margin:0 -16px;padding:12px 16px 10px;background:linear-gradient(var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;font-size:20px}
.logo svg{width:28px;height:28px}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:14px}
.iconbtn:active{transform:scale(.96)}
.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.search{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px;cursor:pointer;transition:.2s}
.chip.on{color:#04121a;background:linear-gradient(90deg,var(--accent),#67e8f9);border-color:transparent;font-weight:600}
.stats{display:flex;gap:10px;margin:12px 0}
