name: Atualizar notícias
on:
  schedule:
    - cron: "*/20 * * * *"   # de 20 em 20 minutos
  workflow_dispatch: {}       # botão "Run workflow" para forçar
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install feedparser requests deep-translator
      - run: python scripts/fetch_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Atualizar ataques (mapa)
        continue-on-error: true
        run: python scripts/fetch_threats.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Gravar alterações
        run: |
          git config user.name "cyberradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json data/threats.json
          git diff --staged --quiet && exit 0
          git commit -m "Atualizar notícias"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
